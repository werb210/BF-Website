<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- BF_WEBSITE_BOREAL_UI_v1 - approved display and body typefaces. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- BF_WEBSITE_LCP_v14 - the API origin is contacted during first paint;
         PageSpeed lists it as a preconnect candidate worth ~420ms of LCP. -->
    <link rel="preconnect" href="https://server.boreal.financial" crossorigin />
    <!-- BF_WEBSITE_LCP_v14 - load display=swap fonts without blocking paint. -->
    <!-- BF_WEBSITE_v789_CSP - the media swap that was an inline onload= handler
         now runs in /js/head-init.js, so the CSP needs no inline script. -->
    <link
      id="bf-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Public+Sans:wght@400;500;600;700&display=swap"
      media="print"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <!-- BF_WEBSITE_v789_CONSENT - Consent Mode v2 defaults are all DENIED
         (analytics_storage, ad_storage, ad_user_data, ad_personalization) until
         the visitor clicks Accept. They, the Ads tag config, the font swap and
         the service worker registration live in /js/head-init.js so the CSP can
         forbid inline script. It must stay above the gtag.js tag. -->
    <script src="/js/head-init.js"></script>
    <!-- BF_WEBSITE_ADS_TAG_v152
     The Google Ads tag lived only on client.boreal.financial, never on this
     domain, even though every ad lands here first. Consequences: no _gcl_aw
     cookie is written on the landing domain, no remarketing audience can be
     collected from ad traffic, and attribution across the hop to the
     application wizard depends entirely on the URL parameters appended by
     buildApplyUrl / the click interceptor in main.tsx - with no cookie
     fallback if that link is bypassed.

     linker.domains lets the two properties share the click id, which is the
     supported cross-domain mechanism. It is additive: the explicit gclid
     forwarding already in main.tsx keeps working.

     This sits BELOW the consent defaults (/js/head-init.js, which also
     holds the gtag config call), so Consent Mode v2 still gates it -
     ad_storage is denied until the banner grants. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18248196538"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boreal Financial</title>
    <!-- BF_WEBSITE_v789_ROUTE_META - data-rh lets react-helmet-async replace
         this tag instead of adding a second description. -->
    <meta
      data-rh="true"
      name="description"
      content="Boreal Financial provides fast business financing including term loans, lines of credit, factoring, and equipment financing for Canadian businesses."
    />
    <link rel="icon" href="/favicon.ico" />
    <!-- BF_WEBSITE_BLOCK_1_36_PWA_SETUP -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0B1F3A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- BF_WEBSITE_BLOCK_v83_LAUNCH_POLISH_v1 — modern, non-deprecated equivalent -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Boreal" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
    <!-- BF_WEBSITE_v789_CONSENT - Microsoft Clarity is no longer loaded here.
         It loads only after Accept (client/src/analytics/consent.ts). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
